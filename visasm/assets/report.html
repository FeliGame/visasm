<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>visasm report</title>
<style>
/*__VISASM_CSS__*/
</style>
</head>
<body>
<header class="top">
  <div class="brand">visasm</div>
  <div class="report-name" id="report-name"></div>
  <nav class="report-nav" aria-label="Report">
    <button id="tab-overview" type="button" aria-current="page">Overview</button>
    <button id="tab-callgraph" type="button">Call graph</button>
  </nav>
</header>

<main>
  <section id="view-overview" class="overview" aria-label="Overview">
    <div class="summary" id="summary"></div>
    <section class="overview-functions" aria-labelledby="overview-title">
      <div class="overview-head">
        <h1 id="overview-title">Functions</h1>
        <input class="filter" id="overview-search" type="search" aria-label="Filter functions by regular expression" placeholder="Filter functions (regex)">
      </div>
      <div class="overview-scroll">
        <table class="funcs">
          <thead>
            <tr>
              <th scope="col"><button data-sort="name">Function</button></th>
              <th scope="col" class="num" aria-sort="descending"><button data-sort="hot">Hottest BB</button></th>
              <th scope="col" class="num"><button data-sort="flow">Block exec sum</button></th>
              <th scope="col" class="num"><button data-sort="entry">Entries</button></th>
              <th scope="col" class="num"><button data-sort="blocks">BBs</button></th>
              <th scope="col" class="num"><button data-sort="acc">Profile match</button></th>
            </tr>
          </thead>
          <tbody id="overview-body"></tbody>
        </table>
      </div>
    </section>
  </section>

  <section id="graph-workspace" class="workspace" aria-label="Graph workspace" hidden>
    <div class="cg-toolbar" id="cg-toolbar">
      <label class="cg-opt"><input type="checkbox" id="cg-external" checked> External calls</label>
      <label class="cg-opt"><input type="checkbox" id="cg-labels"> Edge counts</label>
      <span class="cg-stat" id="cg-stat"></span>
      <span class="cg-hotscale" title="Node color by hottest basic block">Cold <i></i> Hot</span>
    </div>
    <div class="func-head" id="func-head" hidden>
      <button type="button" id="back-to-report" class="back"><span aria-hidden="true">←</span> <span id="back-label"></span></button>
      <h1 id="func-name" tabindex="-1"></h1>
    </div>
    <div class="stage" id="stage">
      <div class="graph-surface" id="view-callgraph">
        <svg id="cg" aria-label="Function call graph">
          <defs>
            <marker id="cg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb0c6"></path>
            </marker>
          </defs>
          <g id="cg-canvas"></g>
        </svg>
        <div class="empty graph-empty" id="cg-empty" hidden>No functions in the call graph</div>
      </div>
      <div class="graph-surface" id="view-function" hidden>
        <svg id="cfg" aria-label="Control-flow graph">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b6c8"></path>
            </marker>
            <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#d46a35"></path>
            </marker>
          </defs>
          <g id="canvas"></g>
        </svg>
        <div class="empty graph-empty" id="cfg-empty" hidden>No basic blocks</div>
      </div>

      <aside class="panel sidebar" id="function-panel" aria-labelledby="function-panel-title">
        <div class="panel-head">
          <h2 id="function-panel-title">Functions</h2>
          <button type="button" class="panel-toggle" id="toggle-functions" aria-controls="function-panel-body">
            <span class="toggle-label" aria-hidden="true"></span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
        </div>
        <div class="panel-body" id="function-panel-body">
          <div class="panel-body" id="call-functions">
            <div class="search"><input class="filter" id="search" type="search" aria-label="Filter functions by regular expression" placeholder="Filter functions (regex)"></div>
            <div class="funclist" id="funclist"></div>
          </div>
          <div class="panel-body function-overview" id="function-overview" hidden>
            <dl class="func-stats" id="func-stats"></dl>
            <p class="warning" id="func-warning" hidden>Unknown control flow</p>
            <div class="function-calls" id="function-calls"></div>
            <h3 class="block-heading">Basic blocks</h3>
            <div class="funclist" id="blocklist"></div>
          </div>
        </div>
      </aside>

      <div class="right-panels" id="right-panels">
        <aside class="panel inspector" id="inspector" aria-labelledby="inspector-title">
          <div class="panel-head">
            <button type="button" class="panel-toggle" id="toggle-inspector" aria-controls="inspector-body">
              <span class="chevron" aria-hidden="true"></span>
              <span class="toggle-label" aria-hidden="true"></span>
            </button>
            <h2 id="inspector-title">Calls</h2>
          </div>
          <div class="panel-body" id="inspector-body">
            <div class="detail" id="cg-detail">
              <p class="empty" id="cg-no-selection">Select a function to view its calls.</p>
              <div class="dhead" id="cg-info" hidden></div>
              <div class="cg-links" id="cg-links" hidden></div>
            </div>
            <div class="detail" id="cfg-detail" hidden>
              <p class="empty" id="cfg-no-selection" hidden>No block selected</p>
              <div class="dhead" id="detail-head"></div>
              <div class="edges" id="detail-edges"></div>
              <div class="asm" id="asm"></div>
            </div>
          </div>
        </aside>

        <aside class="panel source-panel collapsed" id="source-panel" aria-labelledby="source-title" hidden>
          <div class="panel-head">
            <button type="button" class="panel-toggle" id="toggle-source" aria-controls="source-body">
              <span class="source-chevron chevron" aria-hidden="true"></span>
              <span class="toggle-label" aria-hidden="true"></span>
            </button>
            <h2 id="source-title">Source</h2>
          </div>
          <div class="panel-body source-body" id="source-body" hidden>
            <div class="source-toolbar" id="source-toolbar" hidden>
              <span id="source-filename"></span>
              <select id="source-file" aria-label="Source file" hidden></select>
              <select id="source-target" aria-label="Instruction for selected source line" hidden></select>
            </div>
            <p class="empty source-unavailable" id="source-unavailable" hidden>Source file unavailable. Showing mapped line numbers.</p>
            <div class="source-scroll" id="source-scroll"></div>
          </div>
        </aside>
      </div>

      <div class="zoombtns" role="group" aria-label="Graph zoom">
        <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-fit" title="Fit graph to view">Fit</button>
        <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      </div>
    </div>
  </section>
</main>

<script>
const DATA = /*__VISASM_DATA__*/;
</script>
<script>
/*__VISASM_JS__*/
</script>
</body>
</html>
