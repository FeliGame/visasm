[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visasm"
version = "0.1.0"
description = "Machine basic block hotspot profiles and execution timelines"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
visasm = "visasm.cli:main"

[tool.setuptools.packages.find]
include = ["visasm*"]

[tool.setuptools.package-data]
visasm = ["assets/*"]
"visasm.trace" = ["qemu_plugin.c", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
